[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waveattn_sopseg"
version = "1.0.0"
description = "WaveAttn SOPSeg: High-Precision Mangrove Canopy Disturbance Mapping via Frequency-Aware Prompted Segmentation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Can Gio Mangrove Disturbance Research Team" }
]
keywords = [
    "remote sensing",
    "mangrove canopy disturbance",
    "foundation models",
    "wavelet transform",
    "oriented prompting",
    "earth observation",
    "can gio biosphere reserve"
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "segmentation-models-pytorch>=0.3.3",
    "rasterio>=1.3.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0"
]
